            "session": {"cells": [{"code_hash": "b79830a067bd9454269e66e84adc175b", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"core-idea\">\ud83e\udde0 Core Idea</h1>\n<span class=\"paragraph\">The goal is to check whether amino acid sequences and their 3D structure strings (3Di) encode consistent, symmetric information \u2014 like a \"mirror test\" for biological data.</span>\n<h2 id=\"dataset\">\ud83e\uddec Dataset</h2>\n<span class=\"paragraph\">ProstT5Dataset: Contains tokenized amino acid sequences (input_id_y) and their corresponding 3Di structure tokens (input_id_x), extracted from the AlphaFold DB.</span>\n<span class=\"paragraph\">Each sample is used to generate a positive pair (real match) and a negative pair (random mismatch) to train a classifier.</span>\n<h2 id=\"model-architecture-chiraltranslatornet\">\ud83c\udfd7\ufe0f Model Architecture: ChiralTranslatorNet</h2>\n<span class=\"paragraph\">Embeds each input (sequence &amp; structure) \u2192 then processes both:</span>\n<span class=\"paragraph\">Left Path: Sequence \u279d Structure</span>\n<span class=\"paragraph\">Right Path: Structure \u279d Sequence</span>\n<span class=\"paragraph\">These two paths are run through the same CNN.</span>\n<span class=\"paragraph\">Final output is the difference between left and right pathways \u2192 passed to a classifier.</span>\n<blockquote>\n<span class=\"paragraph\">\ud83d\udca1 Think of it like a symmetry detector \u2014 is the model\u2019s representation similar in both directions?</span>\n</blockquote>\n<h1 id=\"hypothesis\">\ud83e\uddea Hypothesis:</h1>\n<span class=\"paragraph\">Since AlphaFold\u2019s 3Di structures are learned approximations of the true spatial configuration of a protein, and are derived deterministically from the amino acid sequence, there exists a translation symmetry between the sequence and its structure \u2014 i.e., the learned representations should be bi-directionally consistent and the ChiralNet should pick up on this pattern.</span></span>"}, "type": "data"}]}, {"code_hash": "a502c19843a53c37e1980cde2904cb6c", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "cea5c48f78c44a31dccdac30f4ed3f36", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "bfb7aa00fe5e2d9c38db28f3dfcf5d00", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "bed742ac485380ad0571ef1da5b0991a", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9ac869470c2016be2afe2067e2773559", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>Loading and processing &#x27;train&#x27; data...</span><span>Loading and processing &#x27;valid&#x27; data...</span></div>"}, "type": "data"}]}, {"code_hash": "abc9e0f21c77a322c4f3e1381433dac4", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>\n--- Starting Training on Translation Symmetry Task ---</span><span>Epoch 1/10 | Loss: 0.1769 | L Norm (S-&gt;T, last batch): 72.51 | R Norm (T-&gt;S, last batch): 71.03</span><span>Epoch 2/10 | Loss: 0.1364 | L Norm (S-&gt;T, last batch): 71.70 | R Norm (T-&gt;S, last batch): 70.27</span><span>Epoch 3/10 | Loss: 0.1364 | L Norm (S-&gt;T, last batch): 80.07 | R Norm (T-&gt;S, last batch): 77.35</span><span>Epoch 4/10 | Loss: 0.1325 | L Norm (S-&gt;T, last batch): 78.76 | R Norm (T-&gt;S, last batch): 75.88</span><span>Epoch 5/10 | Loss: 0.1347 | L Norm (S-&gt;T, last batch): 86.16 | R Norm (T-&gt;S, last batch): 84.63</span><span>Epoch 6/10 | Loss: 0.1336 | L Norm (S-&gt;T, last batch): 82.40 | R Norm (T-&gt;S, last batch): 81.17</span><span>Epoch 7/10 | Loss: 0.1320 | L Norm (S-&gt;T, last batch): 81.08 | R Norm (T-&gt;S, last batch): 79.48</span><span>Epoch 8/10 | Loss: 0.1325 | L Norm (S-&gt;T, last batch): 79.86 | R Norm (T-&gt;S, last batch): 77.53</span><span>Epoch 9/10 | Loss: 0.1308 | L Norm (S-&gt;T, last batch): 88.32 | R Norm (T-&gt;S, last batch): 86.27</span><span>Epoch 10/10 | Loss: 0.1331 | L Norm (S-&gt;T, last batch): 88.54 | R Norm (T-&gt;S, last batch): 86.96</span></div>"}, "type": "data"}]}, {"code_hash": "403be87a5de4131cbb8898766c0520b5", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>\nFinal Validation Accuracy: 91.46%</span></div>"}, "type": "data"}]}, {"code_hash": "3e8f66af60aba59d63efccce35c6b882", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABW0AAAJOCAYAAADMCCWlAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjMsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvZiW1igAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3XdYVEcXBvCXpYMUKYKiFLFhQ9EYO3bQNKOJXUmMJmosnz12YxJLEjVGo6liibHEEqMRsaFijSKoCFiQJkpvS4dlvj+QjSuILCwsyPt7nvske3dm7tk7bLIcZs9oABAgIiIiIiIiIiIiompBou4AiIiIiIiIiIiIiOg/TNoSERERERERERERVSNM2hIRERERERERERFVI0zaEhEREREREREREVUjTNoSERERERERERERVSNM2hIRERERERERERFVI0zaEhEREREREREREVUjTNoSERERERERERERVSNM2hIRERERERERERFVI0zaElGV8PDwgBACdnZ2KhvTzs4OQgh4eHiobEwiZfn4+MDHx0fdYRARERFRDeXq6gohBIYOHaruUIioGmHSlqgGEkKU6XB1dVV3qCoxcuRIzJgxQ91hFPPmm2/i7NmziI2NRUZGBkJDQ7F37164ubmpO7RKNXDgQCxbtqxKr/nsz3VeXh4SExNx/fp1fPfdd3BycqrSWIiIiIgqQ9Eihw4dOqg7lDLp2rUrDh48iJiYGGRnZyMsLAw//vgjGjVqpO7QiilKir7oGD58uLpDJCIqRkvdARCR8saMGaPweNy4cRgwYECx88HBwVUZVqUZNWoUWrdujQ0bNiicj4
