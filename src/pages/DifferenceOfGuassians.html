lse}, "id": "Hstk", "name": ""}, {"code": "", "code_hash": "fa38cad0776498f217415870ba6858ed", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "nWHF", "name": ""}, {"code": "", "code_hash": "74de2ccc9fcc2be10eb06cb957666f5c", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "iLit", "name": ""}, {"code": "", "code_hash": "97a511b967d2648c5a4cc250083be779", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "ZHCJ", "name": ""}, {"code": "", "code_hash": "07b6e0548c1096ee3379c17840ce3daa", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "ROlb", "name": ""}, {"code": "", "code_hash": "b7693bdc78104f8df6e54a58c295eb08", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "qnkX", "name": ""}, {"code": "", "code_hash": "85d5fb4f1fd0adc4132b5705761e65d4", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "TqIu", "name": ""}, {"code": "", "code_hash": "52b99b56d1c21b63921bbfdccca5eca0", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Vxnm", "name": ""}, {"code": "", "code_hash": "5606440b09d4ab4e7194abe87927d367", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Bljq", "name": ""}, {"code": "", "code_hash": "9021c427b447d9e2541343dab5069c4d", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "KtaK", "name": ""}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": null, "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "1883329ae82d3627e3db2cd8d7719415", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "38eacfeb87da352b4b5207f4c689393b", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9fda237f698ee6fb8d31626a1cf741ad", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"linear-with-abs\">Linear with Abs</h1>\n<span class=\"paragraph\"><strong>Analogy:</strong> Think of it as a linear layer that only cares about the absolute value of its output, not whether it's positive or negative.\n<strong>Analogy:</strong> Think of it as a linear layer that only cares about the magnitude of its output, not whether it's positive or negative.</span></span>"}, "type": "data"}]}, {"code_hash": "58dfc094ca67a740b6bbddca1d3e2826", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fbb2e890ee2fb5cee74e210846f0eb4b", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"dual-path-neuron-layer\">Dual Path Neuron Layer</h1>\n<ul>\n<li>Takes a single input and passes it through two seperate linear layers.</li>\n<li><code>combine_mode</code> determines how the two layers are combined</li>\n</ul>\n<h2 id=\"combine-modes\">Combine Modes</h2>\n<ol>\n<li>\n<span class=\"paragraph\">Difference <code>linear_a - linear_b</code></span>\n</li>\n<li>\n<span class=\"paragraph\">Product <code>linear_a * linear_b</code></span>\n</li>\n<li>\n<span class=\"paragraph\">Average Inverted B <code>(linear_a + (-1 * linear_b)) / 2</code></span>\n</li>\n<li>\n<span class=\"paragraph\">Sum Abs <code>Abs(linear_a) + Abs(linear_b)</code></span>\n</li>\n<li>\n<span class=\"paragraph\">Sum Direct <code>linear_a + linear_b</code></span>\n</li>\n<li>\n<span class=\"paragraph\">Max Abs Signed <code>Max(Abs(linear_a), Abs(linear_b))</code></span>\n</li>\n</ol></span>"}, "type": "data"}]}, {"code_hash": "e55d2a4530d1eece40e374b0a0c62a98", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "79d3e3d55da880971dc1cf443b659bc4", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "62359aef764a4c4843428ba630508810", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fe8ae1eefe111a7529e7ee58911adf97", "console": [], "id": "RGSE", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "c0b2ffe35d12525413b0e1388fa7cbd5", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e0215e3f84d63fdc1f58a82c3d9a3c7c", "console": [], "id": "emfo", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "caae55ac1373459bf6dc52311561a4bf", "console": [], "id": "Hstk", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"normality-normalization\">Normality Normalization</h1>\n<ul>\n<li>Similar to Layer Normalization</li>\n<li>Finds the mean and standard deviation then uses Yeo-Johnson transformation to make the data distribution more symmetric/normal.</li>\n<li>Optionally during training we can add some Gaussian noise to the data.</li>\n</ul>\n<h2 id=\"why-use-it\">Why use it?</h2>\n<ul>\n<li><strong>Improved Stability:</strong> Normalization techniques generally help stabilize training and allow for higher learning rates.</li>\n<li><strong>Better Convergence:</strong> By making distributions more Gaussian-like, it can help optimization algorithms converge faster.</li>\n<li><strong>Flexibility:</strong> The Yeo-Johnson transform and the optional noise add flexibility to adapt to different data distributions.</li>\n<li><strong>Handles Different Inputs:</strong> It's designed to work with different input shapes, particularly common in CNNs (e.g., normalizing over spatial dimensions).</li>\n</ul></span>"}, "type": "data"}]}, {"code_hash": "fa38cad0776498f217415870ba6858ed", "console": [], "id": "nWHF", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "74de2ccc9fcc2be10eb06cb957666f5c", "console": [], "id": "iLit", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"difference-of-guassians\">Difference of Guassians</h1>\n<ul>\n<li>Difference of Gaussians is often used in image processing for edge detection.</li>\n<li><code>Linear_A</code> processes the input, applies ReLU, then optionally adds Gaussian noise.</li>\n<li><code>Linear_B</code> processes the input independently, applies ReLU, then optionally adds Gaussian noise.</li>\n<li>The normalized outputs of Path A and Path B are subtracted from each other (norm_A - norm_B). This subtraction highlights the differences between the two filtered views. Where the filters respond similarly, the output is near zero. Where they respond differently (e.g., one detects an edge, the other sees a broader texture), the difference is large.</li>\n</ul>\n<span class=\"paragraph\">The Difference of Gaussians is a model that is primarily from Computer Vision. We will test it on the AG_NEWS dataset to see how it performs on a NLP task and to see if the normality normalization helps.</span></span>"}, "type": "data"}]}, {"code_hash": "97a511b967d2648c5a4cc250083be779", "console": [], "id": "ZHCJ", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "07b6e0548c1096ee3379c17840ce3daa", "console": [], "id": "ROlb", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "b7693bdc78104f8df6e54a58c295eb08", "console": [], "id": "qnkX", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "85d5fb4f1fd0adc4132b5705761e65d4", "console": [], "id": "TqIu", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "52b99b56d1c21b63921bbfdccca5eca0", "console": [], "id": "Vxnm", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>\n--- Final Comparison ---</span><span>Standard Model Test Accuracy     : 0.8722</span><span>AbsPreReLU Model Test Accuracy   : 0.8670</span><span>DualPath Model (difference) Test Accuracy: 0.8653</span><span>DoGInspired (noise=0.1, LN=T) Test Accuracy: 0.8618</span><span>DoGInspired (noise=0.0, LN=T) Test Accuracy: 0.8687</span><span>\nBest performing model: Standard with accuracy: 0.8722</span></div>"}, "type": "data"}]}, {"code_hash": "5606440b09d4ab4e7194abe87927d367", "console": [], "id": "Bljq", "outputs": [{"data": {"application/vnd.vegalite.v5+json": "{\n  \"$schema\": \"https://vega.github.io/schema/vega-lite/v5.20.1.json\",\n  \"config\": {\n    \"view\": {\n      \"continuousHeight\": 300,\n      \"continuousWidth\": 300\n    }\n  },\n  \"data\": {\n    \"name\": \"data-75be51ca01bdf940a5a76e6652cd41e9\"\n  },\n  \"datasets\": {\n    \"data-75be51ca01bdf940a5a76e6652cd41e9\": [\n      {\n        \"Accuracy\": 0.8721934369602763,\n        \"Model\": \"Standard\"\n      },\n      {\n        \"Accuracy\": 0.8670120898100173,\n        \"Model\": \"AbsPreReLU\"\n      },\n      {\n        \"Accuracy\": 0.8652849740932642,\n        \"Model\": \"DualPath (difference)\"\n      },\n      {\n        \"Accuracy\": 0.8618307426597582,\n        \"Model\": \"DoGInspired (noise=0.5, LN=T)\"\n      },\n      {\n        \"Accuracy\": 0.8687392055267703,\n        \"Model\": \"DoGInspired (noise=0.0, LN=T)\"\n      }\n    ]\n  },\n  \"encoding\": {\n    \"tooltip\": [\n      {\n        \"field\": \"Model\",\n        \"type\": \"nominal\"\n      },\n      {\n        \"field\": \"Accuracy\",\n        \"format\": \".4f\",\n        \"type\": \"quantitative\"\n      }\n    ],\n    \"x\": {\n      \"field\": \"Model\",\n      \"sort\": \"-y\",\n      \"title\": \"Model Architecture\",\n      \"type\": \"nominal\"\n    },\n    \"y\": {\n      \"field\": \"Accuracy\",\n      \"title\": \"Test Accuracy\",\n      \"type\": \"quantitative\"\n    }\n  },\n  \"mark\": {\n    \"type\": \"bar\"\n  },\n  \"title\": \"Model Performance Comparison on AG_NEWS Dataset\",\n  \"usermeta\": {\n    \"embedOptions\": {}\n  },\n  \"width\": \"container\"\n}"}, "type": "data"}]}, {"code_hash": "9021c427b447d9e2541343dab5069c4d", "console": [], "id": "KtaK", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"conclusions\">Conclusions:</h1>\n<ul>\n<li>DoG-Inspired vs. Baseline: The Difference of Gaussians (DoG) inspired network achieved performance comparable to the baseline linear model on the AG_News classification task. This suggests that while the DoG architecture offers a different approach to feature extraction, its benefits weren't significantly realized on this specific dataset.</li>\n<li>Dual Path Network Efficacy: The Dual Path network demonstrated superior performance, particularly when utilizing the \"difference\" combination mode. This outcome implies that for this dataset, the distinct processing paths within the network captured complementary information, and their divergence (difference) was key to improved classification.</li>\n<li>Normality Normalization Impact: The integration of Normality Normalization did not yield a noticeable performance boost for the DoG-inspired network. Further investigation might be needed to understand if the normalization's properties are better suited to different data distributions or network architectures.</li>\n</ul>\n<span class=\"paragraph\">Overall Takeaway: This exploration highlights the diverse impact of architectural choices on model performance. It underscores that while novel architectures like DoG and Dual Path networks offer intriguing mechanisms for feature processing, their effectiveness is dataset-dependent. The success of the Dual Path network, especially with the \"difference\" mode, emphasizes the value of exploring different feature combination strategies.</span></span>"}, "type": "data"}]}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},

        };
