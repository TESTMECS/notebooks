abled": false, "hide_code": false}, "id": "Xref", "name": ""}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": "35ec4256f7343e9a3f4ebf099d93bed9", "console": [], "id": "KUCK", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"abstract\">\ud83d\udcd6 Abstract</h1>\n<span class=\"paragraph\">We introduce ChiralNet, a neural network architecture designed to act as a learned quantum entanglement witness. By comparing a full two-qubit quantum state \u03c1 with its separated product form \u03c1_A \u2297 \u03c1_B, ChiralNet learns to detect the \"chirality\" or asymmetry characteristic of entangled states. Unlike traditional entanglement criteria (e.g., PPT or CHSH), which are often limited to specific cases or assumptions, ChiralNet operates as a general-purpose detector and regressor, trained on simulated quantum states. Demonstrating its effectiveness in both binary classification (entangled vs. separable) and continuous regression (predicting concurrence) tasks, achieving high accuracy and robust generalization under noise. This approach opens the door to learned entanglement witnesses that scale to more complex or noisy quantum systems.</span></span>"}, "type": "data"}]}, {"code_hash": "5658a487bec8347156169794bae69064", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "96ae6540cd83f7374d668a80e65ed0ae", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "fd63d3a5d08959eb53050185f298def8", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e453f5786fee69ce1a87f8eede0d8c88", "console": [], "id": "Wprl", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d21f4d10611c0d0296587a8930d41d2c", "console": [], "id": "CSfZ", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "b01bf30e0111e5d6e26f20e3b2711bd1", "console": [], "id": "YXqJ", "outputs": [{"data": {"text/html": "<div style='display: lNet compares the full density matrix with its \"separated\" version to detect this fundamental asymmetry.</span>\n<h2 id=\"architecture-strategy\">\ud83c\udfd7\ufe0f Architecture Strategy</h2>\n<span class=\"paragraph\">The network processes two inputs:\n1. <strong>Full quantum state</strong> \u03c1 (potentially entangled)\n2. <strong>Separated version</strong> \u03c1_A \u2297 \u03c1_B (always separable)</span>\n<span class=\"paragraph\">By learning the <strong>difference</strong> between these representations, it becomes an effective <strong>entanglement witness</strong>.</span></span>"}, "type": "data"}]}, {"code_hash": "07fc6f82f5b74d698c366205ec506891", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3a0b63aa52a56ef88d6d617d295201f9", "console": [], "id": "DBqu", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "edb0600b722c6b1ae7b20882854e061f", "console": [], "id": "Xdjc", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><span class=\"paragraph\">print</span></span>"}, "type": "data"}]}, {"code_hash": "103eb0aec5a58642d0c961b751d23735", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>=== Quantum Concurrence Regression ===</span><span>Generated data shapes: x1=torch.Size([8192, 2, 4, 4]), x2=torch.Size([8192, 2, 4, 4]), y=torch.Size([8192, 1])</span><span>Concurrence range: 0.000 to 1.000</span><span>Epoch  100 | Loss: 0.000454 | LR: 1.00e-03</span><span>Epoch  200 | Loss: 0.000244 | LR: 5.00e-04</span><span>Epoch  300 | Loss: 0.000130 | LR: 5.00e-04</span><span>Epoch  400 | Loss: 0.000125 | LR: 5.00e-04</span><span>Epoch  500 | Loss: 0.000068 | LR: 2.50e-04</span><span>\n=== Regression Results ===</span><span>Test MSE: 0.008066</span><span>Test MAE: 0.077589</span><span>Prediction range:
