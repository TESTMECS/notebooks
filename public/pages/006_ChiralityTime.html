            "session": {"cells": [{"code_hash": "883502031841cb0e74c8d90f6b2c76a3", "console": [], "id": "DWCq", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"the-arrow-of-time-detector-with-enhanced-chiralnet\">\u23f0 The Arrow of Time Detector with Enhanced ChiralNet</h1>\n<h2 id=\"experimental-design-the-causality-witness\">\ud83c\udfaf Experimental Design: The \"Causality Witness\"</h2>\n<h3 id=\"the-objects-of-our-system\">The \"Objects\" of Our System</h3>\n<span class=\"paragraph\">We work with two fundamentally different types of time-series data:</span>\n<span class=\"paragraph\"><strong>\ud83d\udd04 Reversible Process (Label 0)</strong>: A process that is statistically identical when played forwards or backwards. The Ornstein-Uhlenbeck (OU) process is our perfect candidate - a \"mean-reverting\" random walk, like a particle in a bowl of molasses being jostled by random forces. It wiggles around an average value but has no overall trend. Its future and past look identical.</span>\n<span class=\"paragraph\"><strong>\u27a1\ufe0f Irreversible Process (Label 1)</strong>: A process with a clear, undeniable \"arrow.\" A random walk with strong, consistent drift - like a particle being pushed by constant wind. Played in reverse, it looks deeply unnatural, as if the particle is being \"sucked\" towards its origin against the random forces.</span>\n<h3 id=\"the-chiralnet-setup\">\ud83e\udde0 The ChiralNet Setup</h3>\n<ul>\n<li><strong>Architecture</strong>: 1D Convolutional Neural Network (CNN) optimized for sequential pattern detection</li>\n<li><strong>Left Pathway</strong>: Sees time series in chronological order (t\u2081 \u2192 t\u2082 \u2192 t\u2083)  </li>\n<li><strong>Right Pathway</strong>: Sees time-reversed sequence (t\u2083 \u2192 t\u2082 \u2192 t\u2081)</li>\n<li><strong>Task</strong>: \"Is this an irreversible process?\"</li>\n</ul>\n<h3 id=\"hypothesis\">\ud83d\udca1 Hypothesis</h3>\n<span class=\"paragraph\">When the network encounters:\n- <strong>Reversible (OU) process</strong>: Forward and backward views contain identical statistical information \u2192 Symmetric input\n- <strong>Irreversible (drift) process</strong>: Forward and backward views are fundamentally different \u2192 Asymmetric input</span>\n<span class=\"paragraph\"><strong>Prediction</strong>: The network cannot simply ignore one pathway. It will be forced into cooperation, with both pathway norms rising together as the ChiralNet learns that the relationship between forward and backward views is the key to identifying the direction of time even in reversible processes. </span></span>"}, "type": "data"}]}, {"code_hash": "7e828723ae646cbcac9113f7c6629da1", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0bd6e861e8b91eaba58c3f94de806d97", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3d7a6ef1c854a2f4ffa807247076e760", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "c3a707dbde453618363696e71a984c7a", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "568bfcb5ab12a2457ca382f1db787944", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABW0AAAHqCAYAAAB/bWzAAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjMsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvZiW1igAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3Xd4U2UbBvC76UjbNN2TQqFA2XvIlL0EkaEsB0MEAVFEXOAAXOiHgAgCDkRERFABZZa9obI3BUrppHuvtEnO90eatKG7TXLa9P5dVy6bM5+TN5HTp0+e1wKAACIiIiIiIiIiIiKqFiRiB0BEREREREREREREBZi0JSIiIiIiIiIiIqpGmLQlIiIiIiIiIiIiqkaYtCUiIiIiIiIiIiKqRpi0JSIiIiIiIiIiIqpGmLQlIiIiIiIiIiIiqkaYtCUiIiIiIiIiIiKqRpi0JSIiIiIiIiIiIqpGmLQlIiIiIiI n<li>Chiral Net learned to use both path norms to predict the label (0 for Reversible and 1 for Irreversible)</li>\n<li>In, this way we show that the Chiral Network learns features of both non-reversible and reversible networks and is able to predict the label of both.</li>\n<li><strong>Synthetic data gap</strong> \u2014 The generated data (OU vs. drift) may be too clean and separable, unlike real-world cases where forward and backward might only differ subtly.</li>\n</ul>\n<h2 id=\"so-whats-the-point-then\">So what's the point then?</h2>\n<span class=\"paragraph\">This experiment is proof-of-concept: if a network can distinguish forward from backward time on idealized physical processes, it hints that time asymmetry is detectable from local statistics in dynamics. It's like teaching a machine what entropy feels like without needing equations.</span></span>"}, "type": "data"}]}, {"code_hash": "253183fe35e0fdbdf76ec8d46fd9df70", "console": [], "id": "HITF", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><span class=\"paragraph\">Now we are going to try something harder. A Henon Map is a map of the attractor of the Henon\nmap which is a special case of the Lorenz map. Basically its a discrete but chaotic\nattractor.</span></span>"}, "type": "data"}]}, {"code_hash": "b7607d9da2b30a6c39d971fb5c380c98", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABdAAAAPeCAYAAAAMETjbAAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjEwLjMsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvZiW1igAAAAlwSFlzAAAPYQAAD2EBqD+naQABAABJREFUeJzs3XtcVHX+x/H3zBnuAlqimGXalXIrw0vRzy2LNF1rs5tZrVm2lbmWZm2tlaWuK2WFWbJZVmg3zbS0i4palrWapqaWgqWSlQhqKKAMl5k5vz+QyRHQgwIzg6/n43Eezjnne875ns9Azfnwnc/XJskUAAAAAAAAAADwYfd3BwAAAAAAAAAACEQk0AEAAAAAAAAAqAYJdAAAAAAAAAAAqkECHQAAAAAAAACAapBA 1 id=\"chiralnet-can-a-neural-net-sense-the-flow-of-time\">\ud83d\udd0d ChiralNet: Can a Neural Net Sense the Flow of Time?</h1>\n<span class=\"paragraph\">This experiment explores a deep question:<br />\n<strong>Can we teach a machine to tell if a signal is running forward or backward in time?</strong></span>\n<h3 id=\"what-we-did\">\ud83e\uddea What We Did</h3>\n<span class=\"paragraph\">We built a special neural network called <strong>ChiralNet</strong> and gave it two types of signals:\n1. <strong>Reversible signals</strong> \u2013 like a random wiggle that looks the same forward or backward.\n2. <strong>Irreversible signals</strong> \u2013 like a process being pushed in one direction (like wind or drift). Playing it backward just looks <em>wrong</em>.</span>\n<span class=\"paragraph\">We trained ChiralNet to answer one simple question:  </span>\n<blockquote>\n<span class=\"paragraph\">\"Does this signal have a clear arrow of time?\"</span>\n</blockquote>\n<span class=\"paragraph\">To test it harder, we gave it signals from a <strong>chaotic system</strong> called the <strong>Henon map</strong> \u2014 a simple math formula that produces wild, unpredictable motion. It's fast, efficient, and captures the essence of chaos without using differential equations.</span>\n<hr />\n<h3 id=\"how-chiralnet-works\">\u2699\ufe0f How ChiralNet Works</h3>\n<ul>\n<li>It looks at each signal <strong>forwards</strong> and <strong>backwards</strong></li>\n<li>Then it compares what it \"feels\" in each direction</li>\n<li>If it senses a strong difference, it learns that time has a direction</li>\n</ul>\n<span class=\"paragraph\">Think of it like showing a dog a video and asking, \"Does this look natural or reversed?\" \ud83d\udc15</span>\n<hr />\n<h3 id=\"what-we-found\">\ud83d\udcc8 What We Found</h3>\n<ul>\n<li>ChiralNet learned to detect the <strong>direction of time</strong> with very high accuracy</li>\n<li>Even in chaotic, noisy signals like the Henon map</li>\n<li>The network used both the forward and reversed views to make its decisions</li>\n<li>When time flowed one way, its internal activations changed \u2014 a sign it <em>felt</em> the asymmetry</li>\n</ul>\n<hr />\n<h3 id=\"why-this-matters\">\ud83d\udca1 Why This Matters</h3>\n<span class=\"paragraph\">This isn't just a party trick.</span>\n<ul>\n<li>It shows that <strong>time's arrow leaves a statistical trace</strong></li>\n<li>Even in systems that seem random or chaotic</li>\n<li>Neural networks can learn to <strong>sense causality</strong>, not just patterns</li>\n</ul>\n<hr />\n<h3 id=\"summary\">\ud83d\udcca Summary</h3>\n<table>\n<thead>\n<tr>\n<th>System</th>\n<th>Type</th>\n<th>What Happened</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Drift Walk</td>\n<td>Simple</td>\n<td>Time direction was super obvious</td>\n</tr>\n<tr>\n<td>OU Process</td>\n<td>Reversible</td>\n<td>Harder, but ChiralNet figured it out</td>\n</tr>\n<tr>\n<td>Henon Map</td>\n<td>Chaotic</td>\n<td>ChiralNet still nailed it</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<span class=\"paragraph\">This experiment is a small step toward machines that understand <strong>not just what happened</strong>, but <strong>which way time is flowing</strong>.<br />\nKind of like a compass for causality \ud83e\udded. Teaching machines to understand when reality makes sense.</span>\n<hr />\n<h1 id=\"future-tests\">Future Tests</h1>\n<ul>\n<li>Lorenz attractor (continuous ODE)</li>\n<li>Double pendulum</li>\n<li>Real-world time series (motion sensor, EEG, audio, finance)</li>\n</ul></span>"}, "type": "data"}]}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
