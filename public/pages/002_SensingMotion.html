a <strong>Chiral Neural Network</strong> applied to detect hidden drift in Brownian motion paths. Here's what's happening:</span>\n<h3 id=\"the-task-brownian-motion-drift-detection\">\ud83d\udcca <strong>The Task: Brownian Motion Drift Detection</strong></h3>\n<ul>\n<li><strong>Input</strong>: 3D Brownian motion paths (sequences of random walk steps)</li>\n<li><strong>Challenge</strong>: Classify whether a path contains hidden drift or is pure random motion</li>\n<li><strong>Difficulty</strong>: The drift is subtle and requires detecting long-term directional bias in seemingly random data</li>\n</ul>\n<h3 id=\"the-chiral-architecture\">\ud83e\udde0 <strong>The Chiral Architecture</strong></h3>\n<span class=\"paragraph\">The neural network uses a \"chiral\" (handedness) design with two pathways:\n- <strong>Left Pathway</strong>: Processes the original path data\n- <strong>Right Pathway</strong>: Processes the mirror image (negative) of the path data\n- <strong>Competition</strong>: The final decision comes from <code>Left - Right</code> features</span>\n<h3 id=\"key-observations\">\ud83d\udd0d <strong>Key Observations</strong></h3>\n<h4 id=\"1-chiral-dominance-plot\"><strong>1. Chiral Dominance Plot</strong></h4>\n<span class=\"paragraph\">The first visualization shows how the left and right pathway norms evolve during training:\n- <strong>Symmetry Breaking</strong>: Initially both pathways are similar, but one becomes dominant\n- <strong>Specialization</strong>: The dominant pathway learns to detect the subtle drift patterns\n- <strong>Emergent Chirality</strong>: The network spontaneously develops \"handedness\" to solve the task</span>\n<h4 id=\"2-path-visualizations\"><strong>2. Path Visualizations</strong></h4>\n<span class=\"paragraph\">The 3D plots show:\n- <strong>Blue paths</strong>: Pure Brownian motion (no drift) - correctly classified\n- <strong>Green paths</strong>: Hidden drift paths - correctly classified<br />\n- <strong>Red paths</strong>: Misclassified examples (if any)</span>\n<h3 id=\"expected-results\">\ud83d\udcc8 Expected Results</h3>\n<ul>\n<li>\n<span class=\"paragraph\">Symmetry Baseline: With no hidden drift, the two chiral pathways (processing x and -x) should respond similarly. Thus, the model's decision boundary is effectively random, leading to ~0.5 test accuracy.</span>\n</li>\n<li>\n<span class=\"paragraph\">Symmetry Breaking via Drift: As the drift strength increases, the symmetry is disrupted. One pathway (e.g., the left) increasingly aligns with the directional bias, while the other diverges. This is reflected in the divergence of their activation norms.</span>\n</li>\n<li>\n<span class=\"paragraph\">Emergent Differentiation: The model isn't explicitly given a difference vector\u2014it learns to compute one via competing activations. This resembles a form of automatic differentiation between symmetric and asymmetric components of stochastic motion.</span>\n</li>\n<li>\n<span class=\"paragraph\">Dominance Signal: One pathway should become consistently stronger, acting as a detector for hidden structure.</span>\n</li>\n<li>\n<span class=\"paragraph\">Loss Behavior: A well-designed architecture should yield a smooth, stable decline in loss, especially as it starts capturing the directional signal more effectively.</span>\n</li>\n</ul>\n<span class=\"paragraph\">This demonstrates how bio-inspired asymmetry (chirality) enables the network to detect subtle, directional structure in random data\u2014something symmetric architectures may overlook.</span></span>"}, "type": "data"}]}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
