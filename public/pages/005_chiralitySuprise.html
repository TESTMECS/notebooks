            "session": {"cells": [{"code_hash": "b03ae3d1a8c7e35b57a5d71425064bb8", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "ad578a096bb5682daf8e9fdfeedd0ea5", "console": [], "id": "MJUe", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><h1 id=\"the-experimental-design-the-semantic-compressor\">The Experimental Design: The Semantic Compressor</h1>\n<span class=\"paragraph\"><strong>The Goal</strong>: Train a network to reconstruct a sentence from two views: the full sentence, and a \"skeleton\" version where all the predictable words are masked out.</span>\n<span class=\"paragraph\"><strong>The \"Redundancy\" Proxy</strong>: We'll define \"predictable\" words as common stopwords (\"the\", \"a\", \"is\", \"on\", etc.). These words form the grammatical scaffolding of the language but carry little unique information.</span>\n<span class=\"paragraph\"><strong>The ChiralNet Autoencoder:</strong>: An autoencoder. It takes sequences in and must output sequences of the same shape. The core will be two CNN-based pathways. The left pathway sees the original sentence. The right pathway sees the masked sentence (the \"skeleton\"). </span>\n<span class=\"paragraph\"><strong>The \"Surprise\" Vector</strong>: The <code>l_out - r_out</code> difference vector should, in theory, represent the information content of the unpredictable words that were masked out.</span>\n<span class=\"paragraph\"><strong>The Decoder</strong>: A separate module takes this \"surprise\" vector and attempts to reconstruct the original, complete sentence.</span>\n<span class=\"paragraph\"><strong>The Training Task</strong>: The loss function will measure how accurately the decoder's output matches the original input sentence.</span>\n<span class=\"paragraph\"><strong>The Groundbreaking Hypothesis</strong>: To minimize reconstruction loss, the network must learn to decompose the sentence.</span>\n<span class=\"paragraph\"><strong>The Master Pathway (left) </strong>learns to create a rich feature representation of the entire, correct sentence.</span>\n<span class=\"paragraph\"><strong>The Assistant Pathway (right)</strong> learns the features of the grammatical skeleton.</span>\n<span class=\"paragraph\">The <strong>Decoder</strong> learns to take the \"surprise\" vector\u2014the difference between the two\u2014and use it to fill in the blanks of the skeleton.</span>\n<span class=\"paragraph\">Effectively, the <strong>Assistant Pathway</strong> has been forced to learn a model of pure information or novelty.</span></span>"}, "type": "data"}]}, {"code_hash": "a6eb2d985d847a64eb48bbf17cbcaa57", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "d87e6e3d3da212e9e2d49342b98eaf11", "console": [], "id": "bkHC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a0708d8fb968ab8366efd3d7df8d0077", "console": [], "id": "lEQa", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a3125a9dd486c9f759749f242b4ce743", "console": [], "id": "PKri", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "e3dfda13f38894e6b12df28ccda72a3d", "console": [], "id": "Xref", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "46b9dfef46798b011c3ed3c08a9e0436", "console": [], "id": "SFPL", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "792f7633760e0307165db659311e4439", "console": [], "id": "BYtC", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "3012a75bff2938dc13d322d694f72aea", "console": [], "id": "fqMX", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><span>\n--- Training the Surprise Extractor ---</span><span>\ud83d\ude80 Performance Mode: Batch Size 32, Gradient Accumulation 2</
