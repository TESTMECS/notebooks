            "notebook": {"cells": [{"code": "", "code_hash": "60de06ca3b98051d1d9a3f0dd0a4ee80", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Hbol", "name": ""}, {"code": "", "code_hash": "70b5c5001558b44618441032e13a459f", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "MJUe", "name": ""}, {"code": "", "code_hash": "8bbf62a960e68f114d365c7eb016393b", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "vblA", "name": ""}, {"code": "", "code_hash": "fc4f87a22cfe2b8d337272607766de36", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "bkHC", "name": ""}, {"code": "", "code_hash": "ee1aeacf4e435552be79bf48eb2517dd", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "lEQa", "name": ""}, {"code": "", "code_hash": "8c1750c1f7a1d1682330d5c068582f4e", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "PKri", "name": ""}, {"code": "", "code_hash": "10114dea4f1242e265b94a8aa9d4dce4", "config": {"column": null, "disabled": false, "hide_code": false}, "id": "Xref", "name": ""}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
            "session": {"cells": [{"code_hash": "60de06ca3b98051d1d9a3f0dd0a4ee80", "console": [], "id": "Hbol", "outputs": [{"data": {"text/html": "<span class=\"markdown prose dark:prose-invert\"><span class=\"paragraph\">This notebook showcases the implementation of a Q-Learning agent that leverages SU(2) symmetry for the CartPole environment. It explores how SU(2) transformations, represented by learnable gates, can be integrated into the agent's action space and state representation.</span>\n<span class=\"paragraph\">The core idea is to represent the agent's state as a spinor (a 2-component complex vector) and to use SU(2) transformations as actions. This approach is inspired by quantum mechanics, where SU(2) plays a fundamental role in describing spin.</span></span>"}, "type": "data"}]}, {"code_hash": "70b5c5001558b44618441032e13a459f", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "8bbf62a960e68f114d365c7eb016393b", "console": [], "id": "vblA", "outputs": [{"data": {"text/html": "<marimo-ui-element object-id='vblA-0' random-id='93249155-5b0b-56e2-a74c-703223eddea6'><marimo-code-editor data-initial-value='&quot;class LorentzToSU2:&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n    Class to convert a Lorentz-like SO(3,1) rotation (pure spatial rotation part)&#92;n    into an equivalent SU(2) spinor transformation.&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n&#92;n    def __init__(self, rotation_matrix):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        Initialize with a 3x3 rotation matrix (assumed from SO(3) component).&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        self.rotation_matrix = np.array(rotation_matrix, dtype=float)&#92;n        self.axis, self.angle = self._extract_axis_angle()&#92;n&#92;n    def _extract_axis_angle(self):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        Extract the rotation axis and angle from a 3x3 rotation matrix.&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        R = self.rotation_matrix&#92;n        trace = np.trace(R)&#92;n        angle = np.arccos(np.clip((trace - 1) / 2, -1.0, 1.0))  # Stable arccos&#92;n&#92;n        if np.isclose(angle, 0):&#92;n            return np.array([0, 0, 1]), 0  # Default axis for identity rotation&#92;n&#92;n        rx = R[2, 1] - R[1, 2]&#92;n        ry = R[0, 2] - R[2, 0]&#92;n        rz = R[1, 0] - R[0, 1]&#92;n        axis = np.array([rx, ry, rz]) / (2 * np.sin(angle))&#92;n        return axis, angle&#92;n&#92;n    def to_su2(self):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        Compute the SU(2) matrix corresponding to the axis-angle rotation.&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        sigma_x = np.array([[0, 1], [1, 0]], dtype=complex)&#92;n        sigma_y = np.array([[0, -1j], [1j, 0]], dtype=complex)&#92;n        sigma_z = np.array([[1, 0], [0, -1]], dtype=complex)&#92;n        I = np.eye(2, dtype=complex)&#92;n&#92;n        nx, ny, nz = self.axis / norm(self.axis)&#92;n        generator = nx * sigma_x + ny * sigma_y + nz * sigma_z&#92;n        theta = self.angle&#92;n        return np.cos(theta / 2) * I - 1j * np.sin(theta / 2) * generator&quot;' data-label='null' data-language='&quot;python&quot;' data-placeholder='&quot;&quot;' data-disabled='true' data-min-height='1' data-show-copy-button='true' data-debounce='false'></marimo-code-editor></marimo-ui-element>"}, "type": "data"}]}, {"code_hash": "fc4f87a22cfe2b8d337272607766de36", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "<marimo-ui-element object-id='bkHC-0' random-id='895f81fb-cfdb-b301-913a-9181ebf394db'><marimo-code-editor data-initial-value='&quot;class SU2Attention(nn.Module):&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n    SU(2)-inspired attention layer using 2D complex spinor representations.&#92;n    Each token is represented by a complex 2-vector (spinor).&#92;n    Attention weights are computed via Hermitian inner product (phase-aware).&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n&#92;n    def __init__(self, n_heads=4):&#92;n        super().__init__()&#92;n        self.n_heads = n_heads&#92;n        self.scale = 1.0 / (2**0.5)&#92;n&#92;n    def forward(self, spinors):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        spinors: (batch, seq_len, heads, 2) complex-valued tensor&#92;n        returns: (batch, seq_len, heads, 2) transformed spinors&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;&#92;n        batch, seq_len, heads, _ = spinors.shape&#92;n        assert heads == self.n_heads, &#92;&quot;Head mismatch&#92;&quot;&#92;n&#92;n        # Normalize spinors to unit length&#92;n        normed = spinors / torch.norm(spinors, dim=-1, keepdim=True)&#92;n&#92;n        # Compute attention weights via Hermitian inner product&#92;n        # (spinor_i^&#92;u2020 @ spinor_j) for all i, j in seq&#92;n        spinor_conj = normed.conj().unsqueeze(2)  # (B, T, 1, H, 2)&#92;n        spinor_base = normed.unsqueeze(1)  # (B, 1, T, H, 2)&#92;n        attn_logits = torch.einsum(&#92;n            &#92;&quot;bijhd,bijhd-&gt;bijh&#92;&quot;, spinor_conj, spinor_base&#92;n        )  # (B, T, T, H)&#92;n        attn_weights = F.softmax(attn_logits.real * self.scale, dim=2)  # (B, T, T, H)&#92;n&#92;n        # Apply attention: weighted sum of spinors&#92;n        # Convert attn_weights to complex to match spinors type&#92;n        attn_weights_complex = attn_weights.to(dtype=spinors.dtype)&#92;n        out = torch.einsum(&#92;n            &#92;&quot;bijh,bjhd-&gt;bihd&#92;&quot;, attn_weights_complex, spinors&#92;n        )  # (B, T, H, 2)&#92;n        return out&quot;' data-label='null' data-language='&quot;python&quot;' data-placeholder='&quot;&quot;' data-disabled='true' data-min-height='1' data-show-copy-button='true' data-debounce='false'></marimo-code-editor></marimo-ui-element>"}, "type": "data"}]}, {"code_hash": "ee1aeacf4e435552be79bf48eb2517dd", "console": [], "id": "lEQa", "outputs": [{"data": {"text/html": "<marimo-ui-element object-id='lEQa-0' random-id='69c40441-c78b-0ec5-95ff-f97f6ad9edf4'><marimo-code-editor data-initial-value='&quot;class SU2Gate(nn.Module):&#92;n    def __init__(self):&#92;n        super().__init__()&#92;n        self.axis = nn.Parameter(torch.randn(3))&#92;n        self.angle = nn.Parameter(torch.tensor(0.0))&#92;n&#92;n    def forward(self, spinors):&#92;n        axis = self.axis / torch.norm(self.axis)&#92;n        theta = self.angle&#92;n        nx, ny, nz = axis&#92;n&#92;n        # Pauli matrices&#92;n        &#92;u03c3x = torch.tensor([[0, 1], [1, 0]], dtype=torch.cfloat)&#92;n        &#92;u03c3y = torch.tensor([[0, -1j], [1j, 0]], dtype=torch.cfloat)&#92;n        &#92;u03c3z = torch.tensor([[1, 0], [0, -1]], dtype=torch.cfloat)&#92;n        I = torch.eye(2, dtype=torch.cfloat)&#92;n&#92;n        G = torch.cos(theta / 2) * I - 1j * torch.sin(theta / 2) * (&#92;n            nx * &#92;u03c3x + ny * &#92;u03c3y + nz * &#92;u03c3z&#92;n        )&#92;n        return spinors @ G&quot;' data-label='null' data-language='&quot;python&quot;' data-placeholder='&quot;&quot;' data-disabled='true' data-min-height='1' data-show-copy-button='true' data-debounce='false'></marimo-code-editor></marimo-ui-element>"}, "type": "data"}]}, {"code_hash": "8c1750c1f7a1d1682330d5c068582f4e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "<marimo-ui-element object-id='PKri-0' random-id='5a60d07b-b077-aa4b-9dd1-ed2c60dd61ec'><marimo-code-editor data-initial-value='&quot;class QLearningAgent(nn.Module):&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n    SU(2)-based Q-Learning Agent.&#92;n    Uses a set of learnable SU(2) gates as discrete actions.&#92;n    Maps CartPole observations to SU(2) spinor space.&#92;n    &#92;&quot;&#92;&quot;&#92;&quot;&#92;n&#92;n    def __init__(self, obs_dim=4, n_actions=2, lr=0.001, gamma=0.99):&#92;n        super().__init__()&#92;n        self.actions = nn.ModuleList([SU2Gate() for _ in range(n_actions)])&#92;n&#92;n        # Neural network to map observations to Q-values&#92;n        self.obs_encoder = nn.Sequential(&#92;n            nn.Linear(obs_dim, 64),&#92;n            nn.Tanh(),&#92;n            nn.Linear(64, 64),&#92;n            nn.Tanh(),&#92;n            nn.Linear(64, n_actions),&#92;n        )&#92;n&#92;n        # Neural network to map observations to spinor state&#92;n        self.obs_to_spinor = nn.Sequential(&#92;n            nn.Linear(obs_dim, 8),&#92;n            nn.Tanh(),&#92;n            nn.Linear(8, 4),  # 4 real values -&gt; 2 complex values&#92;n        )&#92;n&#92;n        self.optimizer = torch.optim.Adam(self.parameters(), lr=lr)&#92;n        self.gamma = gamma&#92;n        self.n_actions = n_actions&#92;n        self.eps = 1.0&#92;n        self.eps_decay = 0.9995  # Slower decay&#92;n        self.eps_min = 0.01  # Lower minimum exploration for less noise&#92;n&#92;n        # Experience replay&#92;n        self.memory = deque(maxlen=10000)&#92;n        self.batch_size = 64  # Larger batch for more stable updates&#92;n&#92;n        # Target network for stability&#92;n        self.target_encoder = nn.Sequential(&#92;n            nn.Linear(obs_dim, 64),&#92;n            nn.Tanh(),&#92;n            nn.Linear(64, 64),&#92;n            nn.Tanh(),&#92;n            nn.Linear(64, n_actions),&#92;n        )&#92;n        self.target_encoder.load_state_dict(self.obs_encoder.state_dict())&#92;n        self.target_update_freq = 100  # Update target every 100 steps&#92;n        self.step_count = 0&#92;n&#92;n    def obs_to_su2_state(self, obs):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;Convert CartPole observation to SU(2) spinor state&#92;&quot;&#92;&quot;&#92;&quot;&#92;n        obs_tensor = torch.tensor(obs, dtype=torch.float32)&#92;n        encoded = self.obs_to_spinor(obs_tensor)&#92;n        # Convert 4 real values to 2 complex values&#92;n        real_part = encoded[:2]&#92;n        imag_part = encoded[2:]&#92;n        spinor = torch.complex(real_part, imag_part)&#92;n        # Normalize to unit spinor&#92;n        return spinor / torch.norm(spinor)&#92;n&#92;n    def select_action(self, obs):&#92;n        if random.random() &lt; self.eps:&#92;n            return random.randint(0, self.n_actions - 1)&#92;n&#92;n        obs_tensor = torch.tensor(obs, dtype=torch.float32)&#92;n        q_values = self.obs_encoder(obs_tensor)&#92;n        return torch.argmax(q_values).item()&#92;n&#92;n    def apply_action(self, action_idx, state):&#92;n        gate = self.actions[action_idx]&#92;n        return gate(state)&#92;n&#92;n    def remember(self, obs, action, reward, next_obs, done):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;Store experience in replay buffer&#92;&quot;&#92;&quot;&#92;&quot;&#92;n        self.memory.append((obs, action, reward, next_obs, done))&#92;n&#92;n    def replay(self):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;Train the agent on a batch of experiences&#92;&quot;&#92;&quot;&#92;&quot;&#92;n        if len(self.memory) &lt; self.batch_size:&#92;n            return 0.0&#92;n&#92;n        batch = random.sample(self.memory, self.batch_size)&#92;n        obs_batch = torch.tensor([e[0] for e in batch], dtype=torch.float32)&#92;n        action_batch = torch.tensor([e[1] for e in batch], dtype=torch.long)&#92;n        reward_batch = torch.tensor([e[2] for e in batch], dtype=torch.float32)&#92;n        next_obs_batch = torch.tensor([e[3] for e in batch], dtype=torch.float32)&#92;n        done_batch = torch.tensor([e[4] for e in batch], dtype=torch.bool)&#92;n&#92;n        current_q_values = self.obs_encoder(obs_batch).gather(&#92;n            1, action_batch.unsqueeze(1)&#92;n        )&#92;n        # Use target network for more stable targets&#92;n        next_q_values = self.target_encoder(next_obs_batch).max(1)[0].detach()&#92;n        target_q_values = reward_batch + (self.gamma * next_q_values * ~done_batch)&#92;n&#92;n        loss = F.mse_loss(current_q_values.squeeze(), target_q_values)&#92;n&#92;n        self.optimizer.zero_grad()&#92;n        loss.backward()&#92;n        # Gradient clipping for stability&#92;n        torch.nn.utils.clip_grad_norm_(self.obs_encoder.parameters(), max_norm=1.0)&#92;n        self.optimizer.step()&#92;n&#92;n        # Update target network periodically&#92;n        self.step_count += 1&#92;n        if self.step_count % self.target_update_freq == 0:&#92;n            self.target_encoder.load_state_dict(self.obs_encoder.state_dict())&#92;n&#92;n        # Decay epsilon&#92;n        if self.eps &gt; self.eps_min:&#92;n            self.eps *= self.eps_decay&#92;n&#92;n        return loss.item()&#92;n&#92;n    def update(self, obs, action, reward, next_obs, done):&#92;n        &#92;&quot;&#92;&quot;&#92;&quot;Simple update method for immediate learning&#92;&quot;&#92;&quot;&#92;&quot;&#92;n        self.remember(obs, action, reward, next_obs, done)&#92;n        return self.replay()&quot;' data-label='null' data-language='&quot;python&quot;' data-placeholder='&quot;&quot;' data-disabled='true' data-min-height='1' data-show-copy-button='true' data-debounce='false'></marimo-code-editor></marimo-ui-element>"}, "type": "data"}]}, {"code_hash": "10114dea4f1242e265b94a8aa9d4dce4", "console": [], "id": "Xref", "outputs": [{"data": {"text/html": "<div style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'><marimo-progress data-total='300' data-progress='300' data-rate='1.75' data-eta='0.0'></marimo-progress><span>Episode 1: Total Reward = 14.0, Epsilon = 1.000</span><span>Episode 11: Total Reward = 13.0, Epsilon = 0.892</span><span>Episode 21: Total Reward = 28.0, Epsilon = 0.783</span><span>Episode 31: Total Reward = 97.0, Epsilon = 0.660</span><span>Episode 41: Total Reward = 212.0, Epsilon = 0.382</span><span>Episode 51: Total Reward = 223.0, Epsilon = 0.151</span><span>Episode 61: Total Reward = 195.0, Epsilon = 0.055</span><span>Episode 71: Total Reward = 136.0, Epsilon = 0.024</span><span>Episode 81: Total Reward = 162.0, Epsilon = 0.010</span><span>Episode 91: Total Reward = 154.0, Epsilon = 0.010</span><span>Episode 101: Total Reward = 165.0, Epsilon = 0.010</span><span>Episode 111: Total Reward = 145.0, Epsilon = 0.010</span><span>Episode 121: Total Reward = 29.0, Epsilon = 0.010</span><span>Episode 131: Total Reward = 139.0, Epsilon = 0.010</span><span>Episode 141: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 151: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 161: Total Reward = 243.0, Epsilon = 0.010</span><span>Episode 171: Total Reward = 476.0, Epsilon = 0.010</span><span>Episode 181: Total Reward = 399.0, Epsilon = 0.010</span><span>Episode 191: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 201: Total Reward = 219.0, Epsilon = 0.010</span><span>Episode 211: Total Reward = 156.0, Epsilon = 0.010</span><span>Episode 221: Total Reward = 185.0, Epsilon = 0.010</span><span>Episode 231: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 241: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 251: Total Reward = 18.0, Epsilon = 0.010</span><span>Episode 261: Total Reward = 433.0, Epsilon = 0.010</span><span>Episode 271: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 281: Total Reward = 500.0, Epsilon = 0.010</span><span>Episode 291: Total Reward = 182.0, Epsilon = 0.010</span></div>"}, "type": "data"}]}], "metadata": {"marimo_version": "0.14.6"}, "version": "1"},
