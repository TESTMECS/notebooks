[project]
name = "notebooks"
version = "0.2.0"
description = "Notebook for testing programming implementations."
authors = [{name="test me", email="andrew@ftg.sh"}]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "gymnasium>=1.2.0",
    "ipython>=9.6.0",
    "marimo>=0.14.6",
    "multidict>=6.5.0",
    # Core dependencies for CLI and server
    "rich>=14.0.0", # For beautiful CLI output in main.py
    "watchdog>=6.0.0", # For file watching in CLI
]

[project.optional-dependencies]
# Machine learning and data science dependencies
ml = [
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "scikit-learn>=1.7.0",
    "matplotlib>=3.10.3",
    "datasets>=3.6.0",
    "nltk>=3.9.1",
    "transformers>=4.52.4",
]

# Marimo notebook dependencies
notebooks = [
    "marimo>=0.13.15",
]

# GUI dependencies (for notebooks that need Qt)
gui = [
    "pyqt5>=5.15.11",
]

# AI/LLM dependencies
ai = [
    "google-generativeai>=0.8.5",
    "google-genai>=1.23.0",
]

# Complete ML stack (includes all ML-related dependencies)
full = [
    "notebooks[ml,notebooks,gui,ai]",
]

[tool.ruff]
line-length = 88
target-version = "py312"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.isort]
known-first-party = ["notebooks"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --cov=notebooks"

[dependency-groups]
ml = [
    "seaborn>=0.13.2",
]

